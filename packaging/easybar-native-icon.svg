<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">EasyBar Native icon</title>
  <desc id="desc">The EasyBar martini logo with a feather badge.</desc>

  <defs>
    <linearGradient id="background" x1="72" y1="40" x2="440" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#272c35"/>
      <stop offset="0.52" stop-color="#171a20"/>
      <stop offset="1" stop-color="#0c0e11"/>
    </linearGradient>

    <linearGradient id="letter" x1="108" y1="92" x2="408" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#69bdff"/>
      <stop offset="1" stop-color="#3e8eed"/>
    </linearGradient>

    <linearGradient id="glass" x1="168" y1="250" x2="340" y2="446" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffc15b"/>
      <stop offset="1" stop-color="#ed8a2a"/>
    </linearGradient>

    <linearGradient id="badge" x1="336" y1="326" x2="448" y2="454" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c3a2ff"/>
      <stop offset="1" stop-color="#7657dc"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#background)"/>
  <rect
    x="10"
    y="10"
    width="492"
    height="492"
    rx="110"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.08"
    stroke-width="2"
  />

  <g transform="translate(18 12) scale(0.9)">
    <path
      d="M396 258
         C396 168 338 108 256 108
         C160 108 98 176 98 266
         C98 358 166 416 260 416
         C318 416 366 396 400 358"
      fill="none"
      stroke="url(#letter)"
      stroke-width="44"
      stroke-linecap="round"
    />

    <path
      d="M172 258H396L256 344L172 258Z"
      fill="#ed8a2a"
      fill-opacity="0.09"
      stroke="url(#glass)"
      stroke-width="22"
      stroke-linejoin="round"
    />

    <path
      d="M256 344V414"
      fill="none"
      stroke="url(#glass)"
      stroke-width="22"
      stroke-linecap="round"
    />

    <path
      d="M190 430H322"
      fill="none"
      stroke="url(#glass)"
      stroke-width="22"
      stroke-linecap="round"
    />
  </g>

  <!-- Product-family badge with a font-free feather glyph. -->
  <circle cx="392" cy="392" r="82" fill="#0d0f12"/>
  <circle cx="392" cy="392" r="68" fill="url(#badge)"/>

  <!-- Feather. -->
  <path
    d="M429 347
       C414 349 395 357 380 370
       C365 383 354 400 352 417
       C351 427 353 435 357 441
       C359 425 366 411 377 399
       C389 386 404 375 422 365
       C410 377 399 388 390 400
       L406 397
       C401 404 394 410 385 415
       L397 417
       C389 423 380 426 371 427
       C366 433 362 440 359 447
       L366 449
       C370 438 375 428 381 419
       C392 417 403 412 411 405
       L397 405
       C407 398 415 390 421 381
       L405 385
       C415 374 423 362 429 347Z"
    fill="#ffffff"
  />

  <!-- Feather shaft. -->
  <path
    d="M358 443
       C369 421 384 400 401 383
       C411 373 420 365 429 358"
    fill="none"
    stroke="#ffffff"
    stroke-width="6"
    stroke-linecap="round"
  />
</svg>
